allow_embedding: false
db_schema:
  events:
    client: full
    columns:
    - admin_ui: {width: 200}
      client_hidden: false
      name: name
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: start
      type: datetime
    - admin_ui: {width: 200}
      client_hidden: false
      name: end
      type: datetime
    indexes: []
    server: full
    title: events
  files:
    client: full
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: file_name
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: media
      type: media
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: content_type
      type: string
    - admin_ui: {order: 3, width: 200}
      client_hidden: false
      name: uploaded_at
      type: datetime
    indexes: []
    server: full
    title: files
  messages:
    client: none
    columns:
    - admin_ui: {width: 200}
      client_hidden: false
      name: user
      target: users
      type: link_single
    - admin_ui: {width: 200}
      client_hidden: false
      name: message
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: sent_at
      type: datetime
    - admin_ui: {width: 200}
      client_hidden: false
      name: channel
      type: string
    indexes: []
    server: full
    title: messages
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    - admin_ui: {width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui: {width: 200}
      client_hidden: false
      name: first_name
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: last_name
      type: string
    - admin_ui: {width: 200}
      client_hidden: false
      name: last_seen
      type: datetime
    indexes: []
    server: full
    title: Users
dependencies: []
metadata: {description: placeholder, title: For the love of strings}
name: Stringy
package_name: Stringy
renamed: true
runtime_options:
  client_version: '3'
  legacy_features: {bootstrap3: true, class_names: true}
  server_spec: {}
  server_spec_disabled: {base: python310-minimal}
  server_version: python3-full
  version: 3
services:
- client_config: {enable_v2: false}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: true, confirm_email: false, enable_automatically: true, use_email: true}
  server_config:
    email_content:
      reset_password:
        html: |-
          <p>Hi there,</p>
          <p>You have requested a password reset for your account {{email}}. To reset your password, click the link below:</p>
          <p>{{reset_link}}</p>
          <p>This link will expire in ten minutes.</p>
    user_table: users
  source: /runtime/services/anvil/users.yml
startup: {module: MainForm, type: form}
startup_form: null
